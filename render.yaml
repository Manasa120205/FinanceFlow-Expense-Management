services:
  - type: web
    name: pennyflow-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: PennyFlow API
      - key: CORS_ORIGINS
        value: '["https://pennyflow-in.vercel.app","https://penny-flow-in.vercel.app","http://localhost:5173"]'
