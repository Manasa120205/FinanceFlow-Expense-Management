version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: financeflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financeflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeflow_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-financeflow_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financeflow_user} -d ${POSTGRES_DB:-financeflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeflow_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeflow_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-financeflow_user}:${POSTGRES_PASSWORD:-financeflow_secure_password}@db:5432/${POSTGRES_DB:-financeflow_db}
      JWT_SECRET: ${JWT_SECRET:-please_change_this_super_secret_jwt_key_in_production_32chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ENVIRONMENT: production
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:3000", "http://localhost:5173"]'
    ports:
      - "8000:8000"
    networks:
      - financeflow_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financeflow_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - financeflow_network

volumes:
  postgres_data:
    driver: local

networks:
  financeflow_network:
    driver: bridge
